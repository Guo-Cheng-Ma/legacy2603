system:
  system: dgx-attacc
  gpu: A100a
  ngpu: 8

pim:
  pim: bank
  num_pim_die: 5
  die_type: uniform
  compute_stack_l1: 4
  capacity_stack_l2: 4
  powerlimit: false
  ffopt: false
  pipeopt: false

model:
  model: GPT-175B
  word: 2

workload:
  mode: trace
  lin: 64
  lout: 16
  batch: 1

trace:
  trace_file: llm-req-inputs/uniform-mini-5req.jsonl
  max_batch_size: 5
  prefill_chunk_tokens: 32
  trace_scheduler: continuous
  timestamp_scaling: 1.0
  trace_debug: false
  trace_debug_interval: 100

kv_arch:
  num_cards: 8
  host_kv_total_gb: 512
  dma_bandwidth_gbps: 1676
  pcie_bandwidth_gbps: 64
