# Heterogeneous 3-tier KV cache architecture configuration
# Units:
# - *_gb: GiB
# - *_gbps: GB/s in decimal (1e9 B/s)

kv_arch:
  num_cards: 8
  gpu_mem_per_card_gb: 60

  # KV capacities
  hispeed_kv_per_card_gb: 20
  hicap_total_per_card_gb: 40
  host_kv_total_gb: 512

  # Transfer bandwidths
  dma_bandwidth_gbps: 1676
  pcie_bandwidth_gbps: 64
