system:
  system: dgx-attacc
  gpu: A100a
  ngpu: 8

pim:
  pim: bank
  num_pim_die: 5
  die_type: vstack
  compute_stack_l1: 4
  capacity_stack_l2: 4
  powerlimit: true
  ffopt: true
  pipeopt: true

model:
  model: GPT-175B
  word: 2

workload:
  mode: trace
  lin: 2048
  lout: 128
  batch: 16

trace:
  trace_file: "llm-req-inputs/qwen_coder_blksz_16.jsonl"
  max_batch_size: 16
  prefill_chunk_tokens: 128
  trace_scheduler: continuous
  QPS: 4.0
  trace_debug: true
  trace_debug_interval: 1

kv_arch:
  num_cards: 8
  host_kv_total_gb: 512
  dma_bandwidth_gbps: 1676
  pcie_bandwidth_gbps: 64
  eviction_policy: aware
  placement_policy: hotset_broadcast
  replica_tier: L1
  replica_reserve_ratio_l1: 0.25
  replica_reserve_ratio_l2: 0.0
  aware_policy:
    intra_user_bias: true
    single_turn_bias: true
    ttl_mode: category_ema
    ttl_safety_factor: 1.0
    recency_weight: 1.0
    reuse_weight: 1.0
    locality_weight: 1.0
    cost_weight: 1.0
    hotness_cap: 8
    replica_min_distinct_cards: 3
    replica_min_remote_hits: 8
    replica_score_threshold: 0.0
